services:
  - type: web
    name: crypto-vault
    runtime: node
    plan: free
    # prisma db push applies the Better Auth tables; migrate-auth then moves
    # existing passwords/verification state across and is safe to re-run.
    buildCommand: npm install && npx prisma generate && npx prisma db push && node scripts/migrate-auth.mjs && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: PLUNK_SECRET_KEY
        sync: false
      - key: PLUNK_FROM
        sync: false
      - key: CRON_SECRET
        sync: false
